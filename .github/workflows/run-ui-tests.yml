# GitHub Actions Workflow for running the Starter/Driver UI integration tests on Linux,
# Windows, and Mac. Unlike the old Remote Robot setup, `./gradlew integrationTest` launches,
# drives, and tears down its own sandbox IDE in one step — no separate "start a sandbox, then
# run tests against it" dance needed.
#
# Please check https://plugins.jetbrains.com/docs/intellij/integration-tests.html for more
# information about the Starter/Driver integration test framework.
#
# Workflow is triggered manually.

name: Run UI Tests
on:
  workflow_dispatch

jobs:

  testUI:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Driving a real UI still needs an actual (virtual) display on Linux.
      - name: Run UI integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew integrationTest

      - name: Run UI integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: ./gradlew integrationTest
